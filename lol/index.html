<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>No Trick Poney Challenge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-rgb:         10, 11, 13;
      --surface-rgb:    18, 20, 23;
      --surface-hi-rgb: 30, 34, 40;
      --surface-lo-rgb: 14, 16, 19;
      /* Base neutre : gris-noir, sans dominante chaude. */
      --bg:        #0A0B0D;
      --card:      #121417;
      --card2:     #181B20;
      --card3:     #23272E;
      --text:      #E7EAEE;
      --text2:     #98A0AA;
      --text3:     #626A74;
      --win:       #4FBF8B;
      --win-bg:    rgba(79,191,139,0.10);
      --loss:      #C4462F;
      --loss-bg:   rgba(196,70,47,0.12);
      --radius:    14px;
      --serif:     'Cinzel', 'Bell MT', Georgia, 'Times New Roman', serif;
      --sans:      'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

      /* Accent neutre : acier. Les thèmes joueur ne redéfinissent que ces quatre lignes. */
      --accent:     #B9C3CE;
      --accent-hi:  #F1F5F9;
      --accent-rgb: 185, 195, 206;
      --accent-soft: rgba(185,195,206,0.09);

      --border:  rgba(var(--accent-rgb), 0.24);
      --border2: rgba(var(--accent-rgb), 0.10);
    }

    /* Corentin : rouge sombre. */
    :root[data-theme="corentin"] {
      --bg-rgb:         11, 7, 8;
      --surface-rgb:    23, 16, 15;
      --surface-hi-rgb: 38, 24, 22;
      --surface-lo-rgb: 17, 11, 11;
      --accent:     #D8382B;
      --accent-hi:  #FF8571;
      --accent-rgb: 216, 56, 43;
      --accent-soft: rgba(216,56,43,0.13);
      --bg:    #0B0708;
      --card:  #17100F;
      --card2: #1E1514;
      --card3: #2B1D1B;
    }

    /* Mehdi : bleu sombre. */
    :root[data-theme="mehdi"] {
      --bg-rgb:         7, 10, 15;
      --surface-rgb:    15, 20, 28;
      --surface-hi-rgb: 24, 32, 44;
      --surface-lo-rgb: 11, 15, 21;
      --accent:     #3B7BD8;
      --accent-hi:  #86BBFF;
      --accent-rgb: 59, 123, 216;
      --accent-soft: rgba(59,123,216,0.13);
      --bg:    #070A0F;
      --card:  #0F141C;
      --card2: #141A24;
      --card3: #1D2735;
    }

    /* La bascule doit se voir : tout ce qui porte l'accent glisse d'une teinte à l'autre. */
    body, .card, .tile, nav.tabs, nav.tabs button, .player-switch button,
    .lane, .seg, .seg button, .search, .header-actions button, .header-actions a,
    .champ-img, .match, footer {
      transition: background-color .55s ease, border-color .55s ease,
                  color .55s ease, box-shadow .55s ease;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      padding-bottom: 80px;
    }

    /* Braises et lumière basse, pour que le fond ne soit jamais un noir plat. */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(1100px 600px at 50% 0%, rgba(var(--accent-rgb), 0.10), transparent 65%),
        radial-gradient(700px 500px at 10% 40%, rgba(196,70,47,0.05), transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* ---------- Hero ---------- */
    .hero {
      position: absolute; top: 0; left: 0; right: 0; height: 1000px;
      overflow: hidden; z-index: 0; pointer-events: none;
      /* Repli si l'illustration est absente : le hero reste une scène crédible. */
      background:
        radial-gradient(120% 90% at 50% 10%, #241a10 0%, #120c07 55%, var(--bg) 100%);
    }
    .hero-img {
      position: absolute; inset: 0;
      /*
        Plusieurs sources empilées : la première qui charge s'affiche, les autres restent
        invisibles dessous. Cela évite d'imposer une extension précise au moment du dépôt.
      */
      background-image: url('assets/hero.jpg'), url('assets/hero.jpeg'),
                        url('assets/hero.png'), url('assets/hero.webp');
      background-size: cover; background-position: center 22%;
      background-repeat: no-repeat;
      /* Fondu vers le fond sur les quatre bords : l'image ne doit avoir aucune arête. */
      -webkit-mask-image:
        linear-gradient(to bottom, #000 0%, #000 46%, transparent 96%),
        linear-gradient(to right, transparent 0%, #000 14%, #000 86%, transparent 100%);
      -webkit-mask-composite: source-in;
      mask-image:
        linear-gradient(to bottom, #000 0%, #000 46%, transparent 96%),
        linear-gradient(to right, transparent 0%, #000 14%, #000 86%, transparent 100%);
      mask-composite: intersect;
      opacity: .72; filter: saturate(.85) contrast(1.08);
    }
    /* Voile chaud + vignette : l'illustration passe sous le texte sans le concurrencer. */
    .hero-veil {
      position: absolute; inset: 0;
      background:
        radial-gradient(85% 55% at 50% 22%, rgba(var(--bg-rgb), 0) 0%, rgba(var(--bg-rgb), 0.45) 72%, var(--bg) 100%),
        linear-gradient(to bottom, rgba(var(--bg-rgb), 0.30) 0%, rgba(var(--bg-rgb), 0.10) 24%, rgba(var(--bg-rgb), 0.62) 58%, var(--bg) 92%);
    }

    .wrap { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; padding: 0 18px; }

    /* ---------- Header ---------- */
    header { padding: 430px 0 60px; text-align: center; }
    .eyebrow {
      font-family: var(--serif);
      font-size: 12px; letter-spacing: 0.4em; text-transform: uppercase;
      color: var(--accent); font-weight: 600; margin-bottom: 18px;
      text-shadow: 0 0 18px rgba(var(--accent-rgb), 0.4);
    }
    h1 {
      font-family: var(--serif);
      font-size: clamp(38px, 6vw, 72px); font-weight: 700;
      letter-spacing: 0.02em; line-height: 1.05;
      background: linear-gradient(180deg, var(--accent-hi) 0%, var(--accent) 48%, #8A6E3C 100%);
      -webkit-background-clip: text; background-clip: text;
      color: transparent;
      filter: drop-shadow(0 2px 18px rgba(var(--accent-rgb), 0.35));
    }
    /* Filet doré sous le titre, comme un sceau. */
    h1::after {
      content: ""; display: block; width: 220px; max-width: 60%; height: 1px; margin: 20px auto 0;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
    }
    .subtitle {
      color: var(--text2); font-size: 14px; margin: 16px auto 0; max-width: 620px; line-height: 1.7;
    }

    /* ---------- Tabs ---------- */
    nav.tabs {
      display: flex; gap: 4px; background: rgba(var(--surface-rgb), 0.75);
      border: 1px solid var(--border2); border-radius: 6px;
      padding: 5px; margin: 0 0 22px; overflow-x: auto;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }
    nav.tabs button {
      flex: 1; min-width: 110px; padding: 12px 14px; border: 0; border-radius: 3px;
      background: transparent; color: var(--text2);
      font-family: var(--serif); font-size: 14px; font-weight: 600; letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer; white-space: nowrap; transition: all .18s;
    }
    nav.tabs button:hover { color: var(--accent-hi); }
    nav.tabs button.active {
      background: linear-gradient(180deg, var(--card3), var(--card2));
      color: var(--accent-hi);
      box-shadow: inset 0 0 0 1px var(--border), 0 0 22px rgba(var(--accent-rgb), 0.10);
    }

    /* ---------- Player switch ---------- */
    .player-switch { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
    .player-switch button {
      padding: 9px 18px; border-radius: 4px; border: 1px solid var(--border2);
      background: rgba(var(--surface-rgb), 0.7); color: var(--text2);
      font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
      cursor: pointer; font-family: inherit; display: flex; align-items: center; gap: 8px;
      transition: all .18s;
    }
    .player-switch button:hover { border-color: var(--border); color: var(--text); }
    .player-switch button.active {
      background: var(--accent-soft); border-color: var(--accent); color: var(--accent-hi);
      box-shadow: 0 0 22px rgba(var(--accent-rgb), 0.16);
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

    /* ---------- Cards ---------- */
    .card {
      position: relative;
      background: linear-gradient(180deg, rgba(var(--surface-hi-rgb), 0.92), rgba(var(--surface-lo-rgb), 0.92));
      border: 1px solid var(--border2);
      border-radius: 6px; padding: 24px;
      box-shadow: 0 18px 50px rgba(0,0,0,0.45), inset 0 1px 0 rgba(var(--accent-rgb), 0.08);
    }
    /* Titre de carte encadré de losanges, comme les intertitres de la référence. */
    .card-title {
      font-family: var(--serif);
      font-size: 12.5px; letter-spacing: 0.24em; text-transform: uppercase;
      color: var(--accent); font-weight: 600; margin-bottom: 20px;
      display: flex; align-items: center; gap: 12px; white-space: nowrap;
    }
    .card-title::before, .card-title::after {
      content: ""; height: 1px; flex: 1;
      background: linear-gradient(90deg, transparent, rgba(var(--accent-rgb), 0.34));
    }
    .card-title::after { background: linear-gradient(90deg, rgba(var(--accent-rgb), 0.34), transparent); }
    .grid { display: grid; gap: 16px; }
    .grid-2 { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
    .grid-4 { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }

    /* ---------- Progress card ---------- */
    .prog { display: flex; align-items: center; gap: 20px; }
    .ring { position: relative; width: 104px; height: 104px; flex-shrink: 0; }
    .ring svg { transform: rotate(-90deg); }
    .ring-label {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }
    .ring-pct { font-family: var(--serif); font-size: 22px; font-weight: 700; color: var(--accent-hi); }
    .ring-sub { font-size: 9px; color: var(--text3); font-weight: 600; letter-spacing: 0.18em; }
    .prog-info { min-width: 0; }
    .prog-name {
      font-family: var(--serif); font-size: 22px; font-weight: 700;
      letter-spacing: 0.04em; color: var(--accent-hi); margin-bottom: 4px;
    }
    .prog-riotid {
      font-size: 12px; color: var(--text3); margin-bottom: 12px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .prog-stats { display: flex; gap: 18px; flex-wrap: wrap; }
    .prog-stat-v { font-family: var(--serif); font-size: 19px; font-weight: 700; }
    .prog-stat-l { font-size: 11px; color: var(--text3); margin-top: 1px; }
    /* ---------- Classement ---------- */
    .rank-head {
      display: flex; flex-direction: column; align-items: center;
      text-align: center; gap: 6px; margin-bottom: 18px;
    }
    /*
      Les emblèmes servis par Riot sont des images 16:9 dont l'insigne n'occupe que ~22 %
      de la largeur et ~32 % de la hauteur, centré. Affichés tels quels dans un cadre carré,
      ils paraissent minuscules quelle que soit la taille du cadre. On recadre donc le vide :
      cadre carré en overflow hidden, image agrandie à 380 % et centrée, avec une translation
      de 3 % vers le bas car l'insigne est légèrement au-dessus du centre de l'image.
    */
    .rank-emblem-box {
      position: relative;
      width: min(390px, 82%); aspect-ratio: 1; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }
    /* Halo : l'emblème doit rayonner, c'est le trophée de la page. */
    .rank-emblem-box::before {
      content: ""; position: absolute; inset: 12%;
      background: radial-gradient(circle, rgba(var(--accent-rgb), 0.20) 0%, transparent 62%);
      pointer-events: none;
    }
    .rank-emblem { width: 380%; max-width: none; transform: translateY(3%); }
    .rank-tier {
      font-family: var(--serif); font-size: 34px; font-weight: 700; letter-spacing: 0.06em;
      background: linear-gradient(180deg, var(--accent-hi), var(--accent) 55%, #8A6E3C);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .rank-lp { font-size: 18px; color: var(--accent); font-weight: 700; margin-top: 2px; }
    .rank-record { font-size: 12.5px; color: var(--text2); margin-top: 8px; }
    .lp-chart { border-top: 1px solid var(--border2); padding-top: 14px; }
    .lp-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
    .lp-delta { font-size: 16px; font-weight: 800; }
    .lp-since { font-size: 11.5px; color: var(--text3); }
    .lp-chart svg { width: 100%; height: 110px; display: block; }
    .lp-axis {
      display: flex; justify-content: space-between;
      font-size: 10.5px; color: var(--text3); margin-top: 6px; font-weight: 600;
    }

    /* ---------- Stat tiles ---------- */
    .tile {
      background: linear-gradient(180deg, rgba(var(--surface-hi-rgb), 0.9), rgba(var(--surface-lo-rgb), 0.9));
      border: 1px solid var(--border2); border-radius: 6px; padding: 20px;
      box-shadow: inset 0 1px 0 rgba(var(--accent-rgb), 0.07);
    }
    .tile-v { font-family: var(--serif); font-size: 28px; font-weight: 700; color: var(--accent-hi); }
    .tile-l {
      font-size: 10px; color: var(--text3); margin-top: 6px;
      font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase;
    }

    /* ---------- Bars ---------- */
    .bar-row { display: flex; align-items: center; gap: 12px; margin-bottom: 13px; }
    .bar-row:last-child { margin-bottom: 0; }
    .bar-label { width: 68px; font-size: 13px; font-weight: 600; flex-shrink: 0; }
    .bar-track { flex: 1; height: 22px; background: var(--card2); border-radius: 6px; overflow: hidden; display: flex; }
    .bar-win { background: var(--win); height: 100%; }
    .bar-loss { background: var(--loss); opacity: .55; height: 100%; }
    .bar-meta { width: 116px; text-align: right; font-size: 12px; color: var(--text2); flex-shrink: 0; font-variant-numeric: tabular-nums; }
    .bar-meta b { color: var(--text); font-weight: 700; }
    .empty { color: var(--text3); font-size: 13px; padding: 6px 0; }

    /* ---------- Champion grid ---------- */
    .filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 18px; }
    .search {
      flex: 1; min-width: 190px; padding: 11px 16px; border-radius: 5px;
      border: 1px solid var(--border2); background: rgba(var(--surface-rgb), 0.7); color: var(--text);
      font-size: 14px; font-family: inherit;
    }
    .search:focus { outline: none; border-color: var(--accent); }
    .search::placeholder { color: var(--text3); }
    /* Les libellés longs (« Validés par les deux ») dépassaient la largeur d'un mobile :
       le groupe défile sur lui-même plutôt que de pousser la page. */
    .seg {
      display: flex; background: var(--card); border: 1px solid var(--border2);
      border-radius: 5px; padding: 4px; max-width: 100%; overflow-x: auto;
    }
    .seg button {
      padding: 7px 13px; border: 0; border-radius: 7px; background: transparent;
      color: var(--text2); font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit;
      white-space: nowrap;
    }
    .seg button.active {
      background: var(--card3); color: var(--accent-hi);
      box-shadow: inset 0 0 0 1px var(--border2);
    }

    .lane-bar { display: flex; gap: 6px; margin-bottom: 18px; flex-wrap: wrap; }
    .lane {
      display: flex; align-items: center; gap: 7px; padding: 9px 16px;
      border-radius: 4px; border: 1px solid var(--border2); background: rgba(var(--surface-rgb), 0.7);
      color: var(--text2); font-size: 12px; font-weight: 600; letter-spacing: 0.07em;
      text-transform: uppercase; cursor: pointer;
      font-family: inherit; transition: all .18s;
    }
    .lane img { width: 18px; height: 18px; filter: brightness(2.1); opacity: .75; }
    .lane:hover { color: var(--text); border-color: var(--border); }
    .lane.active {
      background: var(--accent-soft); border-color: var(--accent); color: var(--accent-hi);
      box-shadow: 0 0 20px rgba(var(--accent-rgb), 0.14);
    }
    .lane.active img { filter: brightness(2.6); opacity: 1; }

    .champ-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(74px, 1fr)); gap: 10px;
    }
    .champ {
      position: relative; border: 0; padding: 0; background: transparent;
      cursor: pointer; font-family: inherit; text-align: center;
    }
    .champ-img {
      width: 100%; aspect-ratio: 1; border-radius: 4px; display: block;
      border: 1px solid rgba(var(--accent-rgb), 0.14); background: var(--card2); transition: all .18s;
    }
    /* Ce qui reste à jouer est mis en avant ; ce qui est fait s'efface. */
    .champ.todo .champ-img { border-color: var(--border2); }
    .champ.done .champ-img { filter: grayscale(1) brightness(.45); }
    /* Joué par l'un mais pas par l'autre : à moitié éteint. */
    .champ.partial .champ-img { filter: grayscale(.6) brightness(.72); }
    .champ:hover .champ-img {
      transform: translateY(-3px); filter: none; border-color: var(--accent);
      box-shadow: 0 6px 20px rgba(0,0,0,0.55), 0 0 16px rgba(var(--accent-rgb), 0.22);
    }
    .champ-name {
      font-size: 10.5px; margin-top: 5px; color: var(--text2); font-weight: 600;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .champ.todo .champ-name { color: var(--text); }
    .champ.done .champ-name { color: var(--text3); }

    .champ-badges { position: absolute; top: -5px; right: -5px; display: flex; gap: 2px; }
    .champ-badge {
      font-size: 10px; font-weight: 800; line-height: 1; color: #06111F;
      width: 16px; height: 16px; border-radius: 5px;
      display: flex; align-items: center; justify-content: center;
      border-bottom: 2px solid transparent;
    }
    .champ-badge.v { background: var(--win); }
    .champ-badge.d { background: var(--loss); }

    .champ-owners {
      position: absolute; bottom: 26px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 3px; background: rgba(7,14,27,0.85);
      padding: 3px 5px; border-radius: 999px;
    }
    .champ-owners .dot { width: 6px; height: 6px; }

    /* ---------- Match history ---------- */
    .match {
      display: flex; align-items: center; gap: 14px; padding: 12px 14px;
      border-radius: 5px; border-left: 2px solid var(--loss);
      background: var(--loss-bg); margin-bottom: 8px;
    }
    .match.win { border-left-color: var(--win); background: var(--win-bg); }
    .match.split { border-left-color: var(--accent); background: var(--accent-soft); }
    .match-lines { flex: 1; min-width: 0; }
    .match-line { display: flex; align-items: center; gap: 14px; }
    .match-line + .match-line { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border2); }
    .match-together {
      font-size: 9.5px; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--accent); font-weight: 700; margin-bottom: 8px;
    }
    .match-right { flex-shrink: 0; text-align: right; }
    .match img { width: 42px; height: 42px; border-radius: 8px; flex-shrink: 0; background: var(--card2); }
    .match-champ { flex: 1; min-width: 120px; }
    .match-champ b {
      font-family: var(--serif); font-size: 15px; font-weight: 700;
      letter-spacing: 0.03em; display: block;
    }
    .match-sub { font-size: 11.5px; color: var(--text3); margin-top: 2px; }
    .match-kda { text-align: center; min-width: 96px; font-size: 13.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .match-kda span { display: block; font-size: 11px; color: var(--text3); font-weight: 500; margin-top: 2px; }
    .match-vs { min-width: 118px; font-size: 12px; color: var(--text2); display: flex; align-items: center; gap: 6px; }
    .match-vs img { width: 22px; height: 22px; border-radius: 5px; }
    .match-res {
      min-width: 62px; text-align: right; font-family: var(--serif);
      font-size: 12.5px; font-weight: 700; letter-spacing: 0.1em; color: var(--loss);
    }
    .match.win .match-res { color: var(--win); }
    .match.split .match-res { color: var(--accent); }
    .match-date { min-width: 78px; text-align: right; font-size: 11.5px; color: var(--text3); margin-top: 3px; }

    /* ---------- Modal ---------- */
    .modal-bg {
      position: fixed; inset: 0; background: rgba(3,7,15,0.78); backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center; padding: 18px; z-index: 100;
    }
    .modal {
      background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      padding: 24px; max-width: 460px; width: 100%; max-height: 84vh; overflow-y: auto;
    }
    .modal-head { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
    .modal-head img { width: 62px; height: 62px; border-radius: 12px; }
    .modal-head h3 {
      font-family: var(--serif); font-size: 24px; font-weight: 700; letter-spacing: 0.04em;
      color: var(--accent-hi);
    }
    .modal-tags { font-size: 12px; color: var(--text3); margin-top: 3px; }
    .modal-close {
      margin-top: 20px; width: 100%; padding: 11px; border-radius: 10px; border: 1px solid var(--border2);
      background: var(--card2); color: var(--text); font-size: 14px; font-weight: 600;
      cursor: pointer; font-family: inherit;
    }
    .modal-player { margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid var(--border2); }
    .modal-player:last-of-type { border-bottom: 0; margin-bottom: 0; padding-bottom: 0; }
    .modal-player-name { font-size: 13px; font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; gap: 7px; }

    /* ---------- Setup / states ---------- */
    .notice { border: 1px solid var(--border); background: var(--accent-soft); border-radius: var(--radius); padding: 20px; }
    .notice h2 { font-size: 16px; margin-bottom: 12px; }
    .notice ol { margin: 0 0 0 18px; font-size: 14px; line-height: 1.85; color: var(--text2); }
    .notice code {
      background: rgba(0,0,0,0.35); padding: 2px 6px; border-radius: 4px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; color: var(--accent);
    }
    .notice a { color: var(--accent); }
    footer {
      margin-top: 48px; padding-top: 26px; text-align: center;
      font-size: 11px; color: var(--text3); line-height: 1.9; letter-spacing: 0.04em;
      border-top: 1px solid var(--border2);
    }

    .header-row { display: block; }
    /* Boutons utilitaires relégués dans le coin : le hero reste dégagé. */
    .header-actions {
      position: absolute; top: 22px; right: 18px; z-index: 3;
      display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end;
    }
    .header-actions button, .header-actions a {
      padding: 9px 16px; border-radius: 4px; border: 1px solid var(--border2);
      background: rgba(var(--surface-rgb), 0.72); backdrop-filter: blur(6px);
      color: var(--text2); font-size: 12px; font-weight: 600; letter-spacing: 0.06em;
      cursor: pointer; font-family: inherit; text-decoration: none; white-space: nowrap;
      transition: all .18s;
    }
    .header-actions button:hover, .header-actions a:hover {
      border-color: var(--accent); color: var(--accent-hi);
      box-shadow: 0 0 18px rgba(var(--accent-rgb), 0.18);
    }
    .header-actions button[disabled] { opacity: .5; cursor: default; border-color: var(--border2); }
    .header-actions a { color: var(--text3); }

    /* ---------- Écran de sélection ---------- */
    .gate {
      position: fixed; inset: 0; z-index: 300;
      background: #06070A;
      display: flex; align-items: center; justify-content: center;
      opacity: 1; transition: opacity .5s ease;
    }
    .gate[hidden] { display: none; }
    .gate.closing { opacity: 0; pointer-events: none; }
    .gate-inner { width: 100%; max-width: 1180px; padding: 0 18px; text-align: center; }
    .gate-eyebrow {
      font-family: var(--serif); font-size: 11px; letter-spacing: 0.4em;
      text-transform: uppercase; color: var(--text3); margin-bottom: 14px;
    }
    .gate-title {
      font-family: var(--serif); font-weight: 700;
      font-size: clamp(26px, 4.5vw, 48px); letter-spacing: 0.06em;
      color: var(--text); margin-bottom: 34px;
    }
    .fighters { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .fighter {
      position: relative; overflow: hidden; cursor: pointer;
      border: 1px solid rgba(255,255,255,0.10); border-radius: 6px;
      background: #0C0E12; padding: 0; font-family: inherit;
      aspect-ratio: 1 / 1; max-height: 58vh;
      transition: border-color .3s ease, transform .3s ease, box-shadow .3s ease;
    }
    /* Chaque panneau cadre sa moitié de l'illustration. */
    .fighter::before {
      content: ""; position: absolute; inset: 0;
      /*
        Portrait propre au combattant, avec repli sur l'illustration commune. Les sources
        sont empilées : la première qui charge s'affiche, les autres restent invisibles
        dessous. Aucun panneau vide, même sans portrait déposé.
      */
      background-image: var(--f-img);
      background-size: cover; background-position: center 32%;
      filter: grayscale(1) brightness(.42); transition: filter .35s ease, transform .5s ease;
    }
    .fighter::after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(to top, #06070A 4%, rgba(6,7,10,0.35) 46%, transparent 78%);
      transition: background .35s ease;
    }
    .fighter:hover, .fighter:focus-visible {
      border-color: var(--f-color); transform: translateY(-4px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 40px var(--f-glow);
      outline: none;
    }
    .fighter:hover::before, .fighter:focus-visible::before {
      filter: grayscale(0) brightness(.72); transform: scale(1.04);
    }
    .fighter:hover::after, .fighter:focus-visible::after {
      background: linear-gradient(to top, #06070A 4%, var(--f-veil) 55%, transparent 88%);
    }
    .fighter-label {
      position: absolute; left: 0; right: 0; bottom: 26px; z-index: 2;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
    }
    .fighter-name {
      font-family: var(--serif); font-size: clamp(20px, 2.6vw, 32px); font-weight: 700;
      letter-spacing: 0.08em; color: #fff;
      text-shadow: 0 2px 20px rgba(0,0,0,0.8);
    }
    .fighter-id { font-size: 11px; color: rgba(255,255,255,0.55); letter-spacing: 0.06em; }
    .fighter-go {
      margin-top: 8px; padding: 7px 20px; border-radius: 3px;
      border: 1px solid var(--f-color); color: var(--f-color);
      font-size: 11px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase;
      opacity: 0; transform: translateY(6px); transition: all .3s ease;
    }
    .fighter:hover .fighter-go, .fighter:focus-visible .fighter-go {
      opacity: 1; transform: translateY(0);
    }
    .gate-skip {
      margin-top: 30px; background: none; border: 0; cursor: pointer; font-family: inherit;
      color: var(--text3); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase;
      transition: color .25s ease;
    }
    .gate-skip:hover { color: var(--text); }

    /* ---------- Vidéo d'intro ---------- */
    .intro {
      position: fixed; inset: 0; z-index: 320; background: #000;
      opacity: 1; transition: opacity .6s ease;
    }
    .intro[hidden] { display: none; }
    .intro.closing { opacity: 0; pointer-events: none; }
    .intro video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .intro-skip {
      position: absolute; bottom: 28px; right: 28px;
      padding: 10px 20px; border-radius: 3px;
      border: 1px solid rgba(255,255,255,0.35); background: rgba(0,0,0,0.45);
      color: #fff; font-family: inherit; font-size: 12px; font-weight: 600;
      letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer;
      transition: all .25s ease;
    }
    .intro-skip:hover { border-color: #fff; background: rgba(0,0,0,0.7); }

    @media (max-width: 640px) {
      .fighters { grid-template-columns: 1fr; gap: 12px; }
      .fighter { aspect-ratio: 4 / 3; max-height: none; }
      .fighter::before { background-position: center 22%; }
      .intro-skip { bottom: 20px; right: 20px; padding: 9px 16px; font-size: 11px; }
    }

    /* ---------- Bascule de thème ---------- */
    /*
      Onde qui traverse l'écran au changement de joueur, dans la couleur du thème visé.
      Purement décoratif : jamais cliquable, et invisible tant qu'il n'est pas déclenché.
    */
    .theme-flash {
      position: fixed; inset: 0; z-index: 90; pointer-events: none; opacity: 0;
    }
    .theme-flash.on { animation: flash-sweep .85s cubic-bezier(.16,.8,.3,1); }
    .theme-flash::before {
      content: ""; position: absolute; inset: 0;
      background: radial-gradient(circle at 50% 45%,
        rgba(var(--accent-rgb), 0.55) 0%, rgba(var(--accent-rgb), 0.14) 38%, transparent 68%);
    }
    .theme-flash::after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(105deg,
        transparent 38%, rgba(var(--accent-rgb), 0.5) 50%, transparent 62%);
      transform: translateX(-60%);
      animation: flash-band .85s cubic-bezier(.16,.8,.3,1);
    }
    @keyframes flash-sweep {
      0%   { opacity: 0; }
      18%  { opacity: 1; }
      100% { opacity: 0; }
    }
    @keyframes flash-band {
      0%   { transform: translateX(-70%) skewX(-12deg); }
      100% { transform: translateX(70%)  skewX(-12deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .theme-flash.on { animation: none; }
      .theme-flash::after { animation: none; }
    }

    .toast {
      position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
      background: var(--card3); border: 1px solid var(--accent); color: var(--text);
      padding: 11px 20px; border-radius: 999px; font-size: 13px; font-weight: 600;
      z-index: 200; box-shadow: 0 8px 26px rgba(0,0,0,0.45);
      animation: toast-in .25s ease-out;
    }
    @keyframes toast-in { from { opacity: 0; transform: translate(-50%, 10px); } }

    @media (max-width: 640px) {
      .hero { height: 560px; }
      /*
        En cadrage large, les deux personnages deviennent minuscules sur un écran étroit.
        On agrandit l'image au-delà du cadre pour se rapprocher d'eux, et on remonte le
        point de calage pour qu'ils passent au-dessus du titre.
      */
      .hero-img { background-size: auto 150%; background-position: 50% 35%; }
      header { padding: 200px 0 36px; }
      .eyebrow { letter-spacing: 0.26em; font-size: 10px; }
      h1::after { margin-top: 16px; }
      /* Les boutons rejoignent le flux : plus de bandeau flottant sur l'illustration. */
      .header-actions {
        position: static; justify-content: center; margin-top: 22px;
      }
      .header-actions button, .header-actions a { flex: 1; text-align: center; }
      /* Sans cet allègement, les onglets en capitales espacées débordaient et se rognaient. */
      nav.tabs button {
        font-size: 11px; letter-spacing: 0.06em; min-width: 0; padding: 11px 6px;
      }
      .match-vs { display: none; }
      .bar-meta { width: 92px; font-size: 11px; }
      .prog { flex-direction: column; align-items: flex-start; gap: 14px; }
      .rank-emblem-box { width: 88%; }
      .rank-tier { font-size: 26px; }
      .card, .tile { padding: 18px; }
    }
  </style>
</head>
<body>
  <div class="hero" aria-hidden="true">
    <div class="hero-img"></div>
    <div class="hero-veil"></div>
  </div>
  <div class="theme-flash" id="theme-flash" aria-hidden="true"></div>

  <!-- Écran d'accueil : choix du combattant, puis vidéo d'intro. -->
  <div class="gate" id="gate" hidden>
    <div class="gate-inner">
      <div class="gate-eyebrow">No Trick Poney Challenge</div>
      <h2 class="gate-title">Choisis ton combattant</h2>
      <div class="fighters" id="fighters"></div>
      <button class="gate-skip" id="gate-skip">Entrer sans choisir</button>
    </div>
  </div>

  <div class="intro" id="intro" hidden>
    <video id="intro-video" playsinline preload="none"></video>
    <button class="intro-skip" id="intro-skip">Passer l'intro</button>
  </div>
  <div class="wrap">
    <header>
      <div class="header-row">
        <div>
          <div class="eyebrow">League of Legends · Ranked Solo/Duo</div>
          <h1 id="title">No Trick Poney Challenge</h1>
        </div>
        <div class="header-actions">
          <button id="refresh" title="Recharger les données">Actualiser</button>
          <a id="sync-link" hidden target="_blank" rel="noopener"
             title="Ouvre GitHub Actions pour forcer une récupération auprès de Riot">Forcer une synchro</a>
        </div>
      </div>
      <div class="subtitle" id="subtitle">Chargement…</div>
    </header>
    <main id="app"></main>
    <footer id="footer"></footer>
  </div>

  <script>
  'use strict';

  const DDRAGON = 'https://ddragon.leagueoflegends.com';
  const ROLES = [
    ['TOP', 'Top'], ['JUNGLE', 'Jungle'], ['MIDDLE', 'Mid'],
    ['BOTTOM', 'ADC'], ['UTILITY', 'Support'], ['UNKNOWN', 'Autre'],
  ];
  const ROLE_LABEL = Object.fromEntries(ROLES);

  const LANES = [
    ['ALL', 'Tous', null], ['TOP', 'Top', 'top'], ['JUNGLE', 'Jungle', 'jungle'],
    ['MIDDLE', 'Mid', 'middle'], ['BOTTOM', 'ADC', 'bottom'], ['UTILITY', 'Support', 'utility'],
  ];
  const laneIcon = (slug) =>
    `https://raw.communitydragon.org/latest/plugins/rcp-fe-lol-champ-select/global/default/svg/position-${slug}.svg`;

  const state = {
    config: null,
    stats: null,
    version: null,
    champions: [],          // [{numId, key, name, tags}]
    champById: new Map(),   // numId -> champion
    lanes: {},              // clé ddragon -> ['TOP', ...]
    laneFilter: 'ALL',
    tab: 'overview',
    player: 'all',
    champFilter: 'all',     // all | done | todo
    search: '',
    modal: null,
  };

  /* ================= Chargement ================= */

  async function getJson(url) {
    const res = await fetch(url, { cache: 'no-cache' });
    if (!res.ok) throw new Error(`${res.status} sur ${url}`);
    return res.json();
  }

  async function loadChampions() {
    const versions = await getJson(`${DDRAGON}/api/versions.json`);
    state.version = versions[0];
    const data = await getJson(`${DDRAGON}/cdn/${state.version}/data/fr_FR/champion.json`);
    state.champions = Object.values(data.data)
      // Data Dragon liste aussi des variantes hors Faille (préfixées, ex. "Jade_Ahri",
      // avec un identifiant numérique très élevé). Elles ne comptent pas pour le challenge.
      .filter((c) => !c.id.includes('_') && Number(c.key) < 10000)
      .map((c) => ({ numId: Number(c.key), key: c.id, name: c.name, tags: c.tags || [] }))
      .sort((a, b) => a.name.localeCompare(b.name, 'fr'));
    state.champById = new Map(state.champions.map((c) => [c.numId, c]));
  }

  const champIcon = (champ) =>
    champ ? `${DDRAGON}/cdn/${state.version}/img/champion/${champ.key}.png` : '';

  /* ================= Dérivation des stats ================= */

  /** Matchs retenus pour le challenge : hors remakes. */
  function matchesOf(playerId) {
    const p = state.stats.players[playerId];
    if (!p || !p.matches) return [];
    return p.matches.filter((m) => !m.remake);
  }

  function computeStats(playerId) {
    const matches = matchesOf(playerId);
    const byRole = {};
    const byChamp = new Map();
    let wins = 0;

    for (const m of matches) {
      if (m.win) wins++;

      const role = ROLE_LABEL[m.role] ? m.role : 'UNKNOWN';
      byRole[role] = byRole[role] || { games: 0, wins: 0 };
      byRole[role].games++;
      if (m.win) byRole[role].wins++;

      const c = byChamp.get(m.champId) || { games: 0, wins: 0, k: 0, d: 0, a: 0, cs: 0 };
      c.games++;
      if (m.win) c.wins++;
      c.k += m.k; c.d += m.d; c.a += m.a; c.cs += m.cs;
      byChamp.set(m.champId, c);
    }

    // Un champion ne compte pour le challenge que s'il existe encore dans le jeu.
    const played = new Set([...byChamp.keys()].filter((id) => state.champById.has(id)));

    return {
      matches,
      games: matches.length,
      wins,
      losses: matches.length - wins,
      wr: matches.length ? (wins / matches.length) * 100 : 0,
      byRole,
      byChamp,
      played,
      total: state.champions.length,
    };
  }

  /**
   * Verdict porté par la vignette d'un champion : true = gagné, false = perdu, null = jamais joué.
   * Le challenge se joue en une partie par champion, mais rien n'interdit d'en refaire une :
   * on tranche alors à la majorité, et à égalité on retient la partie qui a validé le
   * champion, c'est-à-dire la première.
   */
  function verdict(playerId, champId) {
    const games = matchesOf(playerId).filter((m) => m.champId === champId);
    if (!games.length) return null;
    const wins = games.filter((m) => m.win).length;
    const losses = games.length - wins;
    if (wins !== losses) return wins > losses;
    return games[games.length - 1].win; // triés du plus récent au plus ancien
  }

  /**
   * Lanes d'un champion, du point de vue des joueurs affichés.
   *
   * Le fait prime sur la théorie : dès qu'un joueur a joué un champion, ce sont ses lanes
   * réelles qui comptent pour lui, pas celles de la table. Fiddlesticks joué en jungle ne
   * doit pas ressortir dans le filtre Support sous prétexte qu'il pourrait s'y jouer.
   * La table ne sert que pour les champions que le joueur n'a pas encore faits, où tout
   * reste possible.
   *
   * Renvoie null pour un champion dont on ne sait rien : il reste visible partout plutôt
   * que de disparaître de tous les filtres.
   */
  function lanesFor(champ, list) {
    const table = state.lanes[champ.key] || [];

    // Vue commune : on s'en tient à la répartition de référence. Chacun peut avoir joué le
    // même champion à un poste différent, et réunir les deux ferait apparaître un champion
    // dans une lane qui n'a de sens pour personne.
    if (list.length !== 1) return table.length ? new Set(table) : null;

    // Vue d'un seul joueur : ce qu'il a réellement joué prime, la table ne sert que pour
    // les champions qu'il n'a pas encore faits.
    const jouees = observedLanes(list[0].id).get(champ.numId);
    if (jouees && jouees.length) return new Set(jouees);
    return table.length ? new Set(table) : null;
  }

  let _observed = null;
  /** Lanes réellement jouées par un joueur, champion par champion. */
  function observedLanes(playerId) {
    if (!_observed) {
      _observed = new Map();
      for (const p of players()) {
        const parChamp = new Map();
        for (const m of matchesOf(p.id)) {
          if (!m.role || m.role === 'UNKNOWN') continue;
          const arr = parChamp.get(m.champId) || [];
          if (!arr.includes(m.role)) arr.push(m.role);
          parChamp.set(m.champId, arr);
        }
        _observed.set(p.id, parChamp);
      }
    }
    return _observed.get(playerId) || new Map();
  }

  const players = () => (state.config.players || []).filter((p) => state.stats.players[p.id]);
  const activePlayers = () =>
    state.player === 'all' ? players() : players().filter((p) => p.id === state.player);

  /* ================= Helpers de rendu ================= */

  const el = (html) => {
    const t = document.createElement('template');
    t.innerHTML = html.trim();
    return t.content.firstElementChild;
  };
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pct = (n) => `${n.toFixed(1)}%`;
  const wrColor = (wr) => (wr >= 50 ? 'var(--win)' : 'var(--loss)');

  function timeAgo(ts) {
    const days = Math.floor((Date.now() - ts) / 86400000);
    if (days === 0) return "aujourd'hui";
    if (days === 1) return 'hier';
    if (days < 30) return `il y a ${days} j`;
    if (days < 365) return `il y a ${Math.floor(days / 30)} mois`;
    return `il y a ${Math.floor(days / 365)} an${days >= 730 ? 's' : ''}`;
  }

  function ring(percent, color) {
    const r = 44, c = 2 * Math.PI * r;
    const dash = (Math.min(100, percent) / 100) * c;
    return `
      <div class="ring">
        <svg width="104" height="104" viewBox="0 0 104 104">
          <circle cx="52" cy="52" r="${r}" fill="none" stroke="var(--card3)" stroke-width="8"/>
          <circle cx="52" cy="52" r="${r}" fill="none" stroke="${color}" stroke-width="8"
                  stroke-linecap="round" stroke-dasharray="${dash} ${c - dash}"/>
        </svg>
        <div class="ring-label">
          <div class="ring-pct">${percent.toFixed(0)}%</div>
          <div class="ring-sub">CHALLENGE</div>
        </div>
      </div>`;
  }

  /* ================= Onglet : vue d'ensemble ================= */

  function renderOverview() {
    const list = activePlayers();
    const frag = document.createDocumentFragment();

    // Cartes de progression
    const progGrid = el('<div class="grid grid-2" style="margin-bottom:16px"></div>');
    for (const p of list) {
      const s = computeStats(p.id);
      const entry = state.stats.players[p.id];
      const done = s.played.size;
      const progress = s.total ? (done / s.total) * 100 : 0;

      progGrid.appendChild(el(`
        <div class="card">
          <div class="prog">
            ${ring(progress, p.color)}
            <div class="prog-info">
              <div class="prog-name">${esc(p.name)}</div>
              <div class="prog-riotid">${esc(entry.riotId || '')}</div>
              <div class="prog-stats">
                <div>
                  <div class="prog-stat-v">${done}<span style="color:var(--text3);font-size:13px">/${s.total}</span></div>
                  <div class="prog-stat-l">Champions joués</div>
                </div>
                <div>
                  <div class="prog-stat-v">${s.total - done}</div>
                  <div class="prog-stat-l">Restants</div>
                </div>
                <div>
                  <div class="prog-stat-v" style="color:${wrColor(s.wr)}">${pct(s.wr)}</div>
                  <div class="prog-stat-l">${s.wins}V / ${s.losses}D</div>
                </div>
              </div>
            </div>
          </div>
        </div>`));
    }
    frag.appendChild(progGrid);

    // Tuiles globales
    const all = list.flatMap((p) => matchesOf(p.id));
    const allWins = all.filter((m) => m.win).length;
    const hours = Math.round(all.reduce((sum, m) => sum + m.dur, 0) / 3600);

    // Le challenge est individuel : chacun doit jouer les 173 champions de son côté.
    // Cumuler les deux pools n'aurait donc aucun sens ; ce qui compte à deux, c'est le
    // nombre de champions que TOUT LE MONDE a validé.
    const playedSets = list.map((p) => computeStats(p.id).played);
    const parTous = state.champions.filter((c) => playedSets.every((s) => s.has(c.numId))).length;

    const tiles = el('<div class="grid grid-4" style="margin-bottom:16px"></div>');
    const tileData = [
      [String(all.length), 'Parties ranked'],
      [all.length ? pct((allWins / all.length) * 100) : '—', 'Winrate cumulé'],
      [`${parTous}/${state.champions.length}`, list.length > 1 ? 'Validés par les deux' : 'Champions joués'],
      [`${hours} h`, 'Temps de jeu'],
    ];
    for (const [v, l] of tileData) {
      tiles.appendChild(el(`<div class="tile"><div class="tile-v">${esc(v)}</div><div class="tile-l">${esc(l)}</div></div>`));
    }
    frag.appendChild(tiles);

    // Winrate par rôle
    const roleGrid = el('<div class="grid grid-2" style="margin-bottom:16px"></div>');
    for (const p of list) {
      const s = computeStats(p.id);
      const card = el(`<div class="card"><div class="card-title">Winrate par rôle — ${esc(p.name)}</div></div>`);
      const rows = ROLES.filter(([key]) => s.byRole[key]);
      if (!rows.length) {
        card.appendChild(el('<div class="empty">Aucune partie enregistrée.</div>'));
      } else {
        for (const [key, label] of rows) {
          const r = s.byRole[key];
          const wr = (r.wins / r.games) * 100;
          card.appendChild(el(`
            <div class="bar-row">
              <div class="bar-label">${label}</div>
              <div class="bar-track">
                <div class="bar-win" style="width:${wr}%"></div>
                <div class="bar-loss" style="width:${100 - wr}%"></div>
              </div>
              <div class="bar-meta"><b style="color:${wrColor(wr)}">${pct(wr)}</b> · ${r.games} g</div>
            </div>`));
        }
      }
      roleGrid.appendChild(card);
    }
    frag.appendChild(roleGrid);

    // Classement et courbe de LP
    const rankGrid = el('<div class="grid grid-2"></div>');
    for (const p of list) rankGrid.appendChild(renderRankCard(p));
    frag.appendChild(rankGrid);

    return frag;
  }

  /* ================= Classement ================= */

  const TIERS = ['IRON', 'BRONZE', 'SILVER', 'GOLD', 'PLATINUM', 'EMERALD', 'DIAMOND',
                 'MASTER', 'GRANDMASTER', 'CHALLENGER'];
  const TIER_FR = {
    IRON: 'Fer', BRONZE: 'Bronze', SILVER: 'Argent', GOLD: 'Or', PLATINUM: 'Platine',
    EMERALD: 'Émeraude', DIAMOND: 'Diamant', MASTER: 'Maître', GRANDMASTER: 'Grand Maître',
    CHALLENGER: 'Challenger',
  };
  const DIVISIONS = ['IV', 'III', 'II', 'I'];
  const APEX = 7; // Maître et au-dessus : plus de divisions

  const emblemUrl = (tier) =>
    `https://raw.communitydragon.org/latest/plugins/rcp-fe-lol-static-assets/global/default/images/ranked-emblem/emblem-${String(tier).toLowerCase()}.png`;

  /** LP absolus, pour rendre comparables des rangs de paliers différents. */
  function absLp(r) {
    const ti = TIERS.indexOf(r.tier);
    if (ti < 0) return null;
    if (ti >= APEX) return APEX * 400 + r.lp;
    const di = DIVISIONS.indexOf(r.division);
    return ti * 400 + (di < 0 ? 0 : di) * 100 + r.lp;
  }

  /** Opération inverse : un palier lisible à partir de LP absolus. */
  function rankLabel(abs) {
    if (abs >= APEX * 400) return TIER_FR.MASTER;
    const ti = Math.floor(abs / 400);
    const di = Math.floor((abs % 400) / 100);
    return `${TIER_FR[TIERS[ti]] || ''} ${DIVISIONS[di] || ''}`.trim();
  }

  function renderRankCard(p) {
    const entry = state.stats.players[p.id];
    const rank = entry.rank;
    const card = el(`<div class="card"><div class="card-title">Classement — ${esc(p.name)}</div></div>`);

    if (!rank) {
      card.appendChild(el('<div class="empty">Non classé, ou classement momentanément indisponible.</div>'));
      return card;
    }

    const parties = rank.wins + rank.losses;
    const wr = parties ? (rank.wins / parties) * 100 : 0;
    const apex = TIERS.indexOf(rank.tier) >= APEX;

    card.appendChild(el(`
      <div class="rank-head">
        <div class="rank-emblem-box">
          <img class="rank-emblem" src="${emblemUrl(rank.tier)}" alt="${esc(rank.tier)}"
               onerror="this.closest('.rank-emblem-box').style.display='none'">
        </div>
        <div>
          <div class="rank-tier">${esc(TIER_FR[rank.tier] || rank.tier)}${apex ? '' : ' ' + esc(rank.division)}</div>
          <div class="rank-lp">${rank.lp} LP</div>
          <div class="rank-record">
            ${rank.wins}V / ${rank.losses}D
            <span style="color:${wrColor(wr)}">· ${pct(wr)}</span>
            <span style="color:var(--text3)">sur ${parties} parties classées</span>
          </div>
        </div>
      </div>`));

    card.appendChild(renderLpChart(entry.rankHistory || []));
    return card;
  }

  function renderLpChart(history) {
    const pts = history
      .map((h) => ({ ts: h.ts, abs: absLp(h) }))
      .filter((h) => h.abs !== null);

    if (pts.length < 2) {
      return el(`<div class="empty">Courbe de LP en construction : l'API Riot ne fournit
        pas d'historique, les points sont relevés à chaque synchronisation.
        ${pts.length ? 'Premier relevé enregistré.' : ''}</div>`);
    }

    const W = 600, H = 150, PAD = 4;
    const min = Math.min(...pts.map((p) => p.abs));
    const max = Math.max(...pts.map((p) => p.abs));
    const span = Math.max(max - min, 20); // évite une ligne écrasée quand tout est plat
    const t0 = pts[0].ts, t1 = pts[pts.length - 1].ts;
    const dt = Math.max(t1 - t0, 1);

    const x = (p) => ((p.ts - t0) / dt) * (W - PAD * 2) + PAD;
    const y = (p) => H - PAD - ((p.abs - min) / span) * (H - PAD * 2);

    const ligne = pts.map((p) => `${x(p).toFixed(1)},${y(p).toFixed(1)}`).join(' ');
    const aire = `${PAD},${H} ${ligne} ${(W - PAD).toFixed(1)},${H}`;
    const delta = pts[pts.length - 1].abs - pts[0].abs;
    const monte = delta >= 0;

    const wrap = el(`
      <div class="lp-chart">
        <div class="lp-head">
          <span class="lp-delta" style="color:${monte ? 'var(--win)' : 'var(--loss)'}">
            ${monte ? '+' : ''}${delta} LP
          </span>
          <span class="lp-since">depuis le ${new Date(t0).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' })}</span>
        </div>
        <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img"
             aria-label="Évolution des LP">
          <polygon points="${aire}" fill="${monte ? 'rgba(61,207,142,0.14)' : 'rgba(229,84,91,0.14)'}"/>
          <polyline points="${ligne}" fill="none" stroke="${monte ? 'var(--win)' : 'var(--loss)'}"
                    stroke-width="2" stroke-linejoin="round" stroke-linecap="round"
                    vector-effect="non-scaling-stroke"/>
        </svg>
        <div class="lp-axis">
          <span>${esc(rankLabel(min))} → ${esc(rankLabel(max))}</span>
          <span>${pts.length} relevés</span>
        </div>
      </div>`);
    return wrap;
  }

  /* ================= Onglet : champions ================= */

  function renderChampions() {
    const list = activePlayers();
    const statsByPlayer = new Map(list.map((p) => [p.id, computeStats(p.id)]));
    const frag = document.createDocumentFragment();

    // Le challenge est individuel : un champion n'est réglé que lorsque CHAQUE joueur
    // affiché l'a joué. Un champion que seul l'un des deux a fait reste à faire pour l'autre.
    const isDone = (numId) => list.every((p) => statsByPlayer.get(p.id).played.has(numId));
    const isPartial = (numId) => !isDone(numId) && list.some((p) => statsByPlayer.get(p.id).played.has(numId));

    // Les compteurs d'état portent sur la lane sélectionnée, pas sur le roster entier.
    const duLane = state.champions.filter((c) => matchesLane(c, list));
    const doneCount = duLane.filter((c) => isDone(c.numId)).length;
    const duo = list.length > 1;

    const filters = el(`
      <div class="filters">
        <input class="search" type="search" placeholder="Rechercher un champion…" value="${esc(state.search)}">
        <div class="seg">
          <button data-f="all">Tous (${duLane.length})</button>
          <button data-f="done">${duo ? 'Validés par les deux' : 'Joués'} (${doneCount})</button>
          <button data-f="todo">Restants (${duLane.length - doneCount})</button>
        </div>
      </div>`);
    filters.querySelector('.search').addEventListener('input', (e) => {
      state.search = e.target.value;
      renderChampGrid(grid, list, statsByPlayer, isDone, isPartial);
    });
    filters.querySelectorAll('.seg button').forEach((b) => {
      b.classList.toggle('active', b.dataset.f === state.champFilter);
      b.addEventListener('click', () => {
        state.champFilter = b.dataset.f;
        render();
      });
    });
    frag.appendChild(filters);

    const laneBar = el('<div class="lane-bar"></div>');
    for (const [key, label, slug] of LANES) {
      const b = el(`
        <button class="lane ${state.laneFilter === key ? 'active' : ''}" data-lane="${key}">
          ${slug ? `<img src="${laneIcon(slug)}" alt="" onerror="this.remove()">` : ''}
          <span>${label}</span>
        </button>`);
      b.addEventListener('click', () => { state.laneFilter = key; render(); });
      laneBar.appendChild(b);
    }
    frag.appendChild(laneBar);

    const grid = el('<div class="champ-grid"></div>');
    renderChampGrid(grid, list, statsByPlayer, isDone, isPartial);
    frag.appendChild(grid);

    return frag;
  }

  /** Un champion dont la lane est inconnue reste visible dans tous les filtres. */
  function matchesLane(c, list) {
    if (state.laneFilter === 'ALL') return true;
    const lanes = lanesFor(c, list);
    return !lanes || lanes.has(state.laneFilter);
  }

  function renderChampGrid(grid, list, statsByPlayer, isDone, isPartial) {
    grid.innerHTML = '';
    const q = state.search.trim().toLowerCase();

    const visible = state.champions.filter((c) => {
      if (q && !c.name.toLowerCase().includes(q) && !c.key.toLowerCase().includes(q)) return false;
      if (!matchesLane(c, list)) return false;
      if (state.champFilter === 'done') return isDone(c.numId);
      if (state.champFilter === 'todo') return !isDone(c.numId);
      return true;
    });

    if (!visible.length) {
      grid.appendChild(el('<div class="empty">Aucun champion ne correspond.</div>'));
      return;
    }

    for (const c of visible) {
      const done = isDone(c.numId);
      const partial = isPartial(c.numId);

      // Verdict V/D uniquement sur une liste personnelle : à deux, deux résultats sur la
      // même vignette ne veulent rien dire. La vue commune garde les pastilles, qui
      // répondent à la seule question qui s'y pose — qui doit encore le jouer.
      let badge = '';
      if (list.length === 1) {
        const p = list[0];
        const stat = statsByPlayer.get(p.id).byChamp.get(c.numId);
        if (stat) {
          const gagne = verdict(p.id, c.numId);
          const detail = stat.games > 1 ? ` — ${stat.games} parties, ${stat.wins}V ${stat.games - stat.wins}D` : '';
          badge = `<div class="champ-badges"><div class="champ-badge ${gagne ? 'v' : 'd'}"
                        title="${esc(p.name)} : ${gagne ? 'gagné' : 'perdu'}${esc(detail)}">${gagne ? 'V' : 'D'}</div></div>`;
        }
      }

      // Pastilles : l'état de chacun, toujours affiché en mode comparaison. Une pastille
      // éteinte signale un joueur qui doit encore jouer ce champion.
      let owners = '';
      if (list.length > 1) {
        const dots = list.map((p) => {
          const ok = statsByPlayer.get(p.id).played.has(c.numId);
          return `<div class="dot" style="background:${ok ? p.color : 'transparent'};box-shadow:inset 0 0 0 1.5px ${ok ? p.color : 'var(--text3)'}"
                       title="${esc(p.name)} : ${ok ? 'joué' : 'à faire'}"></div>`;
        }).join('');
        owners = `<div class="champ-owners">${dots}</div>`;
      }

      const tile = el(`
        <button class="champ ${done ? 'done' : partial ? 'partial' : 'todo'}"
                title="${esc(c.name)}">
          <img class="champ-img" src="${champIcon(c)}" alt="${esc(c.name)}" loading="lazy">
          ${badge}${owners}
          <div class="champ-name">${esc(c.name)}</div>
        </button>`);
      tile.addEventListener('click', () => { state.modal = c.numId; render(); });
      grid.appendChild(tile);
    }
  }

  /* ================= Onglet : historique ================= */

  function renderHistory() {
    const list = activePlayers();

    // Une partie jouée en duo porte le même identifiant de match chez les deux joueurs :
    // on la regroupe pour l'afficher sur une seule ligne au lieu de la compter deux fois.
    const parMatch = new Map();
    for (const p of list) {
      for (const m of matchesOf(p.id)) {
        const entree = parMatch.get(m.id) || { ts: m.ts, dur: m.dur, joueurs: [] };
        entree.joueurs.push({ m, p });
        parMatch.set(m.id, entree);
      }
    }

    const rows = [...parMatch.values()].sort((a, b) => b.ts - a.ts).slice(0, 120);

    const frag = document.createDocumentFragment();
    if (!rows.length) {
      frag.appendChild(el('<div class="card"><div class="empty">Aucune partie enregistrée pour le moment.</div></div>'));
      return frag;
    }

    for (const partie of rows) {
      // Les deux joueurs sont normalement dans la même équipe, mais rien ne le garantit :
      // s'ils se sont retrouvés face à face, on n'affiche pas de résultat commun.
      const memeCamp = partie.joueurs.every((j) => j.m.win === partie.joueurs[0].m.win);
      const gagne = partie.joueurs[0].m.win;
      const duo = partie.joueurs.length > 1;
      const mins = Math.round(partie.dur / 60);

      const lignes = partie.joueurs.map(({ m, p }) => {
        const champ = state.champById.get(m.champId);
        const opp = m.oppChampId ? state.champById.get(m.oppChampId) : null;
        const kda = m.d === 0 ? 'Perfect' : ((m.k + m.a) / m.d).toFixed(2);
        const csm = mins ? (m.cs / mins).toFixed(1) : '0.0';
        return `
          <div class="match-line">
            <img src="${champIcon(champ)}" alt="" loading="lazy">
            <div class="match-champ">
              <b>${esc(champ ? champ.name : m.champ)}</b>
              <div class="match-sub">
                <span style="color:${p.color}">●</span> ${esc(p.name)} · ${ROLE_LABEL[m.role] || 'Autre'}
                ${memeCamp ? '' : ` · <b style="color:${m.win ? 'var(--win)' : 'var(--loss)'}">${m.win ? 'victoire' : 'défaite'}</b>`}
              </div>
            </div>
            <div class="match-kda">
              ${m.k} / <span style="color:var(--loss);display:inline">${m.d}</span> / ${m.a}
              <span>${kda} KDA · ${csm} CS/min</span>
            </div>
            <div class="match-vs">
              ${opp ? `<img src="${champIcon(opp)}" alt="" loading="lazy"> vs ${esc(opp.name)}` : ''}
            </div>
          </div>`;
      }).join('');

      frag.appendChild(el(`
        <div class="match ${memeCamp && gagne ? 'win' : ''} ${memeCamp ? '' : 'split'}">
          <div class="match-lines">
            ${duo ? '<div class="match-together">ensemble</div>' : ''}
            ${lignes}
          </div>
          <div class="match-right">
            <div class="match-res">${memeCamp ? (gagne ? 'VICTOIRE' : 'DÉFAITE') : 'FACE À FACE'}</div>
            <div class="match-date">${mins} min · ${timeAgo(partie.ts)}</div>
          </div>
        </div>`));
    }
    return frag;
  }

  /* ================= Modal champion ================= */

  function renderModal() {
    const champ = state.champById.get(state.modal);
    if (!champ) return null;

    const body = players().map((p) => {
      const s = computeStats(p.id);
      const c = s.byChamp.get(champ.numId);
      if (!c) {
        return `<div class="modal-player">
          <div class="modal-player-name"><span class="dot" style="background:${p.color}"></span>${esc(p.name)}</div>
          <div class="empty">Jamais joué — reste à faire.</div>
        </div>`;
      }
      const wr = (c.wins / c.games) * 100;
      const kda = c.d === 0 ? 'Perfect' : ((c.k + c.a) / c.d).toFixed(2);
      return `<div class="modal-player">
        <div class="modal-player-name"><span class="dot" style="background:${p.color}"></span>${esc(p.name)}</div>
        <div class="prog-stats">
          <div><div class="prog-stat-v">${c.games}</div><div class="prog-stat-l">Parties</div></div>
          <div><div class="prog-stat-v" style="color:${wrColor(wr)}">${pct(wr)}</div><div class="prog-stat-l">${c.wins}V / ${c.games - c.wins}D</div></div>
          <div><div class="prog-stat-v">${kda}</div><div class="prog-stat-l">${(c.k / c.games).toFixed(1)} / ${(c.d / c.games).toFixed(1)} / ${(c.a / c.games).toFixed(1)}</div></div>
        </div>
      </div>`;
    }).join('');

    const bg = el(`
      <div class="modal-bg">
        <div class="modal">
          <div class="modal-head">
            <img src="${champIcon(champ)}" alt="">
            <div>
              <h3>${esc(champ.name)}</h3>
              <div class="modal-tags">${esc(champ.tags.join(' · '))}</div>
            </div>
          </div>
          ${body}
          <button class="modal-close">Fermer</button>
        </div>
      </div>`);

    const close = () => { state.modal = null; render(); };
    bg.addEventListener('click', (e) => { if (e.target === bg) close(); });
    bg.querySelector('.modal-close').addEventListener('click', close);
    return bg;
  }

  /* ================= Rendu principal ================= */

  function render() {
    const app = document.getElementById('app');
    app.innerHTML = '';
    document.querySelectorAll('.modal-bg').forEach((m) => m.remove());

    if (!players().length) {
      app.appendChild(el(`
        <div class="notice">
          <h2>Le suivi n'est pas encore actif</h2>
          <ol>
            <li>Demander une <b>Personal API Key</b> sur <a href="https://developer.riotgames.com" target="_blank" rel="noopener">developer.riotgames.com</a> (la clé de développement expire au bout de 24 h, elle ne suffit pas).</li>
            <li>Ajouter cette clé dans <code>Settings → Secrets and variables → Actions</code> du dépôt, sous le nom <code>RIOT_API_KEY</code>.</li>
            <li>Renseigner vos deux Riot ID (format <code>Pseudo#TAG</code>) et votre région dans <code>lol/config.json</code>.</li>
            <li>Lancer le workflow <code>Sync LoL challenge</code> depuis l'onglet Actions.</li>
          </ol>
        </div>`));
      return;
    }

    // Sélecteur de joueur
    const sw = el('<div class="player-switch"></div>');
    const options = [{ id: 'all', name: 'Les deux', color: 'var(--accent)' }, ...players()];
    for (const o of options) {
      const b = el(`<button class="${state.player === o.id ? 'active' : ''}">
        <span class="dot" style="background:${o.color}"></span>${esc(o.name)}</button>`);
      b.addEventListener('click', () => {
        if (state.player !== o.id) appliquerTheme(o.id, { effet: true });
        state.player = o.id;
        render();
      });
      sw.appendChild(b);
    }
    app.appendChild(sw);

    if (state.tab === 'overview') app.appendChild(renderOverview());
    else if (state.tab === 'champions') app.appendChild(renderChampions());
    else app.appendChild(renderHistory());

    if (state.modal !== null) {
      const modal = renderModal();
      if (modal) document.body.appendChild(modal);
    }

    document.querySelectorAll('nav.tabs button').forEach((b) => {
      b.classList.toggle('active', b.dataset.tab === state.tab);
    });
  }

  function renderChrome() {
    const nom = state.config.challengeName || 'No Trick Poney Challenge';
    document.getElementById('title').textContent = nom;
    document.title = nom; // l'onglet du navigateur suit la config

    const tabs = el(`
      <nav class="tabs">
        <button data-tab="overview">Vue d'ensemble</button>
        <button data-tab="champions">Champions</button>
        <button data-tab="history">Historique</button>
      </nav>`);
    tabs.querySelectorAll('button').forEach((b) => {
      b.addEventListener('click', () => { state.tab = b.dataset.tab; render(); });
    });
    document.getElementById('app').before(tabs);

    updateMeta();
  }

  /** Sous-titre et pied de page : redessinés à chaque rafraîchissement. */
  function updateMeta() {
    const backlog = Object.values(state.stats.players).reduce((n, p) => n + (p.backlog || 0), 0);
    const synced = state.stats.generatedAt
      ? `Dernière synchronisation ${timeAgo(new Date(state.stats.generatedAt).getTime())}`
      : 'Aucune synchronisation effectuée';
    const start = state.stats.challengeStart || state.config.challengeStart;
    const periode = start
      ? ` Parties comptées depuis le ${new Date(start).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' })}.`
      : '';
    document.getElementById('subtitle').textContent =
      `Jouer les ${state.champions.length} champions du jeu, une fois chacun, en ranked Solo/Duo.${periode}`;
    document.getElementById('footer').innerHTML =
      `${esc(synced)}${backlog ? ` · ${backlog} matchs encore à rapatrier` : ''}<br>` +
      `Données Riot Games API · Icônes Data Dragon ${esc(state.version)} · Les remakes ne comptent pas.`;
  }

  /* ================= Écran d'accueil ================= */

  /**
   * Séquence d'arrivée : choix du combattant, vidéo, puis le site.
   *
   * Le site est déjà rendu derrière l'écran : quand la vidéo se termine, il n'y a plus
   * rien à attendre. Tout ce qui suit est décoratif et ne doit jamais empêcher d'accéder
   * au contenu — vidéo absente, format refusé, lecture bloquée par le navigateur : on
   * entre quand même.
   */
  /** Sources d'image d'un panneau, de la plus spécifique au repli commun. */
  function portraitsDe(joueurId) {
    return ['jpg', 'jpeg', 'png', 'webp']
      .map((ext) => `url('assets/fighter-${joueurId}.${ext}')`)
      .concat(`url('assets/hero.jpg')`)
      .join(', ');
  }

  function ouvrirAccueil() {
    const gate = document.getElementById('gate');
    const liste = document.getElementById('fighters');
    const joueurs = players();
    if (!gate || !liste || !joueurs.length) return;

    joueurs.slice(0, 2).forEach((p, i) => {
      const b = el(`
        <button class="fighter" data-side="${i === 0 ? 'left' : 'right'}"
                style="--f-color:${p.color};--f-glow:${p.color}55;--f-veil:${p.color}30;
                       --f-img:${portraitsDe(p.id)}">
          <span class="fighter-label">
            <span class="fighter-name">${esc(p.name)}</span>
            <span class="fighter-id">${esc(state.stats.players[p.id]?.riotId || '')}</span>
            <span class="fighter-go">Combattre</span>
          </span>
        </button>`);
      b.addEventListener('click', () => choisirCombattant(p.id));
      liste.appendChild(b);
    });

    document.getElementById('gate-skip')
      .addEventListener('click', () => { fermer(gate); });

    gate.hidden = false;
  }

  function fermer(element) {
    element.classList.add('closing');
    setTimeout(() => { element.hidden = true; element.classList.remove('closing'); }, 620);
  }

  function choisirCombattant(joueurId) {
    state.player = joueurId;
    appliquerTheme(joueurId);
    render();
    fermer(document.getElementById('gate'));
    lancerIntro(joueurId);
  }

  function lancerIntro(joueurId) {
    const boite = document.getElementById('intro');
    const video = document.getElementById('intro-video');
    if (!boite || !video) return;

    let termine = false;
    const sortir = () => {
      if (termine) return;
      termine = true;
      clearTimeout(secours);
      video.pause();
      video.removeAttribute('src');
      video.innerHTML = '';
      fermer(boite);
    };

    // Si la lecture ne démarre pas dans les temps, on n'immobilise pas le visiteur.
    const secours = setTimeout(() => { if (video.currentTime === 0) sortir(); }, 3500);

    video.addEventListener('ended', sortir, { once: true });
    document.getElementById('intro-skip').onclick = sortir;

    // Deux sources : le navigateur prend la première qu'il sait lire.
    const sources = [
      [`assets/intro-${joueurId}.mp4`, 'video/mp4'],
      [`assets/intro-${joueurId}.webm`, 'video/webm'],
    ];
    // Avec des balises <source>, l'erreur se déclenche sur la source et non sur la vidéo :
    // sans ce comptage, une intro absente laisserait le lecteur ouvert jusqu'au secours.
    let echecs = 0;
    video.innerHTML = '';
    for (const [src, type] of sources) {
      const s = document.createElement('source');
      s.src = src;
      s.type = type;
      s.addEventListener('error', () => { if (++echecs === sources.length) sortir(); });
      video.appendChild(s);
    }

    boite.hidden = false;
    video.load();

    // Le clic sur le combattant fait office de geste utilisateur : le son est autorisé.
    const lecture = video.play();
    if (lecture) lecture.catch(sortir);
  }

  /* ================= Thème ================= */

  /**
   * Bascule l'habillage sur le joueur sélectionné. Purement visuel : la couleur est
   * portée par un attribut sur la racine, tout le reste découle des variables CSS.
   * L'onde n'est jouée qu'au clic, pas au rendu initial ni aux redessins automatiques.
   */
  function appliquerTheme(joueurId, { effet = false } = {}) {
    document.documentElement.dataset.theme = joueurId;
    if (!effet) return;
    const onde = document.getElementById('theme-flash');
    if (!onde) return;
    onde.classList.remove('on');
    void onde.offsetWidth; // force le navigateur à rejouer l'animation depuis le début
    onde.classList.add('on');
  }

  /* ================= Rafraîchissement automatique ================= */

  const REFRESH_MS = 5 * 60 * 1000;

  function toast(message) {
    document.querySelectorAll('.toast').forEach((t) => t.remove());
    const t = el(`<div class="toast">${esc(message)}</div>`);
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 4000);
  }

  /**
   * Recharge stats.json et ne redessine que si la synchro a produit du neuf.
   * L'onglet, le joueur sélectionné et les filtres vivent dans `state` : ils survivent
   * au redessin.
   */
  async function refreshStats({ manual = false } = {}) {
    // Redessiner fermerait la fiche champion ouverte : on repassera au prochain cycle.
    // Un clic explicite, lui, prime sur cette précaution.
    if (state.modal !== null && !manual) return;

    let fresh;
    try {
      // Paramètre anti-cache : GitHub Pages sert stats.json avec un cache agressif.
      fresh = await getJson(`data/stats.json?t=${Date.now()}`);
    } catch {
      if (manual) toast('Données injoignables, réessaie dans un instant');
      return; // hors ligne ou déploiement en cours : on retente au prochain cycle
    }

    if (fresh.generatedAt === state.stats.generatedAt) {
      updateMeta(); // rien de neuf, mais « il y a X minutes » doit avancer
      if (manual) toast('Aucune nouvelle partie');
      return;
    }

    const avant = Object.values(state.stats.players)
      .reduce((n, p) => n + (p.matches || []).length, 0);
    const apres = Object.values(fresh.players || {})
      .reduce((n, p) => n + (p.matches || []).length, 0);

    state.stats = fresh;
    state.stats.players = fresh.players || {};
    _observed = null; // les lanes observées dépendent des parties
    updateMeta();
    render();

    const delta = apres - avant;
    toast(delta > 0
      ? `${delta} nouvelle${delta > 1 ? 's' : ''} partie${delta > 1 ? 's' : ''}`
      : 'Données mises à jour');
  }

  async function init() {
    try {
      const [config, stats, lanes] = await Promise.all([
        getJson('config.json'),
        getJson('data/stats.json').catch(() => ({ players: {} })),
        // Table tenue à la main : son absence ne doit pas empêcher le site de fonctionner.
        getJson('data/champion-lanes.json').catch(() => ({ lanes: {} })),
      ]);
      state.config = config;
      state.stats = stats;
      state.stats.players = stats.players || {};
      state.lanes = lanes.lanes || {};
      await loadChampions();
      appliquerTheme(state.player);
      renderChrome();
      render();
      ouvrirAccueil();

      setInterval(refreshStats, REFRESH_MS);
      // Revenir sur l'onglet est le moment où l'on veut des données fraîches.
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') refreshStats();
      });

      const btn = document.getElementById('refresh');
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        btn.textContent = 'Actualisation…';
        try {
          await refreshStats({ manual: true });
        } finally {
          btn.disabled = false;
          btn.textContent = 'Actualiser';
        }
      });

      // Le site est statique : il ne peut pas déclencher lui-même la récupération auprès
      // de Riot, cela demanderait un jeton GitHub, qui serait public dans la page. Le lien
      // renvoie donc vers le workflow, seul endroit où la synchro peut être forcée.
      if (config.repoUrl) {
        const link = document.getElementById('sync-link');
        link.href = `${config.repoUrl.replace(/\/$/, '')}/actions/workflows/lol-sync.yml`;
        link.hidden = false;
      }
    } catch (err) {
      document.getElementById('subtitle').textContent = 'Erreur de chargement';
      document.getElementById('app').appendChild(
        el(`<div class="notice"><h2>Impossible de charger les données</h2><div class="empty">${esc(err.message)}</div></div>`));
    }
  }

  init();
  </script>
</body>
</html>
